name: Package Warlock Combat Kit

on:
  push:
    branches: [main]
    paths: ["WarlockCombatKit/**", ".github/workflows/package-wck.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (Lua 5.1, same as the WoW client)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          lua5.1 WarlockCombatKit/tests/run.lua

      - name: Read version from TOC
        id: version
        run: |
          version=$(sed -n 's/^## Version: *\([^[:space:]]*\).*/\1/p' WarlockCombatKit/WarlockCombatKit.toc)
          test -n "$version" || { echo "No ## Version in TOC"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: zip -r "WarlockCombatKit-${{ steps.version.outputs.version }}.zip" WarlockCombatKit -x 'WarlockCombatKit/tests/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: wck-v${{ steps.version.outputs.version }}
          ZIP: WarlockCombatKit-${{ steps.version.outputs.version }}.zip
        run: |
          # same version merged again: replace the zip on the existing release; bump ## Version for a new one
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Warlock Combat Kit $TAG" --generate-notes
          fi
